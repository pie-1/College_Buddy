name: CI

on:
  push:
    branches: [ main, backend/auth-setup ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 18
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
    
    - name: Install Dependencies
      run: |
        cd server
        npm install
        cd ../client
        npm install
    
    - name: Build Frontend
      run: |
        cd client
        npm run build